<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPark IA - Administración</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #121212; color: #E0E0E0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { 
            width: 260px; 
            background: #18181b; 
            border-right: 1px solid #27272a; 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.3s ease; 
        }
        .sidebar-header { 
            padding: 25px 20px; 
            font-size: 1.25rem; 
            font-weight: bold; 
            color: #FFFFFF; 
            border-bottom: 1px solid #27272a; 
            text-align: center; 
        }
        .sidebar-menu { list-style: none; padding: 20px 0; flex: 1; }
        .sidebar-menu li a { display: block; padding: 14px 24px; color: #a1a1aa; text-decoration: none; font-size: 15px; transition: 0.2s; }
        .sidebar-menu li.active a, .sidebar-menu li a:hover { background: #27272a; color: #FFFFFF; border-left: 4px solid #3b82f6; }

        .sidebar-footer { padding: 20px; border-top: 1px solid #27272a; }
        .logout-btn { 
            width: 100%; 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: opacity 0.2s; 
        }
        .logout-btn:hover { opacity: 0.85; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: #121212; }
        .navbar { height: 65px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; align-items: center; padding: 0 30px; justify-content: space-between; }
        
        .menu-toggle { background: none; border: none; color: white; font-size: 24px; cursor: pointer; display: none; }
        .container { padding: 40px; max-width: 1100px; margin: 0 auto; width: 100%; }
        h2 { margin-bottom: 25px; color: #FFFFFF; font-size: 1.5rem; }
        
        .table-container { background: #18181b; border: 1px solid #27272a; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #27272a; color: #f4f4f5; padding: 16px 20px; font-size: 14px; text-transform: uppercase; }
        td { padding: 16px 20px; border-bottom: 1px solid #27272a; color: #d4d4d8; font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #202023; }
        
        select { background: #27272a; color: white; border: 1px solid #3f3f46; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        button { padding: 8px 14px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }

        @media(max-width: 768px) {
            .sidebar { position: absolute; height: 100%; z-index: 100; transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">SmartPark IA</div>
        <ul class="sidebar-menu">
            <li class="active"><a href="admin.html">Usuarios</a></li>
            <li><a href="perfil.html">Mi Perfil</a></li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="main-content">
        <header class="navbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <span style="font-weight: 600; color: #a1a1aa; font-size: 14px;">Administración del Sistema</span>
        </header>

        <div class="container">
            <h2>Gestión de Usuarios</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Correo Electrónico</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById("menuToggle");
        const sidebar = document.getElementById("sidebar");
        toggleBtn.addEventListener("click", () => { sidebar.classList.toggle("active"); });
    </script>
    <script type="module" src="./src/admin.js"></script>
</body>
</html>
