<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPark IA - Administración</title>
    <!-- Usamos solo este CSS global -->
    <link rel="stylesheet" href="./css/perfil.css">
        <!-- Fuente Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Aquí se inyecta el menú lateral -->
    <div id="sidebar-container"></div>

    <div class="main-content">
        <!-- Barra superior -->
        <header class="navbar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <span class="navbar-brand">SmartPark IA - Admin</span>
            </div>
        </header>

        <div class="container">
            <h2>Gestión de Usuarios</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Correo Electrónico</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">Cargando usuarios...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="./src/layout.js"></script>
    <script type="module" src="./src/admin.js"></script>
</body>
</html>
