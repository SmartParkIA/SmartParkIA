<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartPark IA - Historial</title>

<link rel="stylesheet" href="./css/perfil.css">


<style>

/* ===== CONTENEDOR HISTORIAL ===== */
#historialContainer{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
    gap:18px;
    margin-top:10px;
    width:100%;
}

/* ===== FILTROS ===== */
.filtros{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin:20px 0 10px;
    padding:16px;
    background:var(--card-surface);
    border:1px solid var(--border-line);
    border-radius:16px;
    width:100%;
    box-sizing:border-box;
}

.filtros .input-wrap{
    position:relative;
    flex:1;
    min-width:220px;
}

.filtros .input-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    color:var(--text-secondary);
    opacity:.7;
    pointer-events:none;
}

.filtros input{
    width:100%;
    padding:12px 15px 12px 42px;
    border-radius:12px;
    border:1px solid var(--border-line);
    background:var(--card-surface);
    color:var(--text-primary);
    outline:none;
    font-size:14px;
    font-weight:400;
    transition:border-color .2s, box-shadow .2s;
    box-sizing:border-box;
}

.filtros input:focus{
    border-color:#10b981;
    box-shadow:0 0 0 3px rgba(16,185,129,.15);
}

.filtros input::placeholder{
    color:var(--text-secondary);
    opacity:.7;
    font-weight:400;
}

/* ===== SELECT PERSONALIZADO (DROPDOWN BONITO) ===== */
.custom-select {
    position: relative;
    flex: 0 0 auto;
    min-width: 200px;
    user-select: none;
}

.select-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border-line);
    background: var(--card-surface);
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
}

.custom-select.open .select-trigger,
.select-trigger:hover {
    border-color: #10b981;
}

.custom-select.open .select-trigger {
    box-shadow: 0 0 0 3px rgba(16,185,129,.15);
}

.select-trigger svg {
    width: 16px;
    height: 16px;
    color: var(--text-secondary);
    transition: transform .3s ease;
}

.custom-select.open .select-trigger svg {
    transform: rotate(180deg);
    color: #10b981;
}

.select-options {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 100%;
    background: var(--card-surface);
    border: 1px solid var(--border-line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all .25s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
    overflow: hidden;
    padding: 6px;
    box-sizing: border-box;
}

.custom-select.open .select-options {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.option {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all .15s ease;
    margin-bottom: 2px;
}

.option:last-child {
    margin-bottom: 0;
}

.option:hover {
    background: rgba(16, 185, 129, 0.1);
    color: #10b981;
    padding-left: 18px; /* Pequeña animación de desplazamiento */
}

.option.selected {
    background: #10b981;
    color: #ffffff;
}

/* Botón limpiar */
.btn-limpiar{
    padding:12px 18px;
    border-radius:12px;
    border:1px solid var(--border-line);
    background:transparent;
    color:var(--text-secondary);
    font-size:14px;
    font-weight:400;
    cursor:pointer;
    transition:all .2s;
}

.btn-limpiar:hover{
    background:var(--border-line);
    color:var(--text-primary);
}

/* ===== TARJETAS ===== */
.historial-card{
    background:var(--card-surface);
    border:1px solid var(--border-line);
    border-radius:18px;
    padding:20px;
    position:relative;
    overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.15);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s;
}

.historial-card::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width:4px;
    height:100%;
    background:var(--text-secondary);
    opacity:.3;
    transition:opacity .25s;
}

.historial-card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 32px rgba(0,0,0,.28);
}

.historial-card:hover::before{
    opacity:1;
}

/* Colores del borde según estado */
.historial-card.finalizada::before{ background:#10b981; }
.historial-card.cancelada::before{ background:#ef4444; }

/* Encabezado tarjeta */
.historial-card .card-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:14px;
    flex-wrap:wrap;
}

.historial-card h3{
    color:var(--text-primary);
    margin:0;
    font-size:17px;
    font-weight:400;
    line-height:1.3;
}

/* Fila de detalles */
.historial-card .detalle{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text-secondary);
    font-size:14px;
    font-weight:400;
    margin:8px 0;
}

.historial-card .detalle svg{
    width:16px;
    height:16px;
    flex-shrink:0;
    opacity:.7;
}

.historial-card .detalle strong{
    color:var(--text-primary);
    font-weight:400;
}

/* Separador */
.historial-card hr{
    border:none;
    border-top:1px dashed var(--border-line);
    margin:14px 0;
}

/* ===== BADGES ===== */
.badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 14px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:400;
    letter-spacing:.3px;
    white-space:nowrap;
}

.badge::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:currentColor;
}

.badge.estado-finalizada{
    background:rgba(16,185,129,.12);
    color:#10b981;
    border:1px solid rgba(16,185,129,.3);
}

.badge.estado-cancelada{
    background:rgba(239,68,68,.12);
    color:#ef4444;
    border:1px solid rgba(239,68,68,.3);
}

/* Texto de estado sin badge (fallback) */
.estado-finalizada{ color:#10b981; font-weight:400; }
.estado-cancelada{ color:#ef4444; font-weight:400; }

/* Estado vacío */
.empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--text-secondary);
    font-weight:400;
}

.empty-state svg{
    width:60px;
    height:60px;
    opacity:.4;
    margin-bottom:14px;
}

/* ===== RESPONSIVE ===== */
@media (max-width:600px){
    .filtros{ flex-direction:column; }
    .custom-select,
    .btn-limpiar{ width:100%; }
    #historialContainer{ grid-template-columns:1fr; }
}

</style>


</head>


<body>


<div id="sidebar-container"></div>


<div class="main-content">


<header class="navbar">

<div style="display:flex;align-items:center;gap:15px;">

<button class="menu-toggle" id="menuToggle">
☰
</button>


<span class="navbar-brand">
Historial de Reservaciones
</span>


</div>

</header>



<div class="container">


<h2>
Mis Reservaciones Anteriores
</h2>



<div class="profile-card">


<div class="info-grid" style="width:100%;">

<div class="filtros">

    <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
            type="text"
            id="buscarEstacionamiento"
            placeholder="Buscar estacionamiento...">
    </div>

    <!-- NUEVO DROPDOWN PERSONALIZADO -->
    <div class="custom-select" id="customSelect">
        <div class="select-trigger" id="selectTrigger">
            <span id="selectLabel">Todos los estados</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        <div class="select-options">
            <div class="option selected" data-value="">Todos los estados</div>
            <div class="option" data-value="Finalizada">Finalizada</div>
            <div class="option" data-value="Cancelada">Cancelada</div>
        </div>
        <!-- Input oculto para que tu historial.js siga funcionando igual -->
        <input type="hidden" id="buscarEstado" value="">
    </div>

    <button class="btn-limpiar" id="btnLimpiar">Limpiar</button>

</div>

<div id="historialContainer">

<p style="color:var(--text-secondary);">
Cargando historial...
</p>

</div>


</div>


</div>


</div>



</div>



<script type="module" src="./src/layout.js"></script>


<script type="module" src="historial.js"></script>


<script>
// ===== LÓGICA DEL DROPDOWN PERSONALIZADO =====
const customSelect = document.getElementById('customSelect');
const selectTrigger = document.getElementById('selectTrigger');
const selectLabel = document.getElementById('selectLabel');
const options = document.querySelectorAll('.option');
const hiddenInput = document.getElementById('buscarEstado'); // Input oculto para el filtro

// Abrir / Cerrar el menú
selectTrigger.addEventListener('click', () => {
    customSelect.classList.toggle('open');
});

// Seleccionar una opción
options.forEach(option => {
    option.addEventListener('click', () => {
        // Remover clase selected de todas
        options.forEach(opt => opt.classList.remove('selected'));
        // Agregar al seleccionado
        option.classList.add('selected');
        
        // Actualizar texto visible
        selectLabel.textContent = option.textContent;
        
        // Actualizar valor del input oculto (para que historial.js lo lea)
        hiddenInput.value = option.dataset.value;
        
        // Disparar evento 'change' por si historial.js lo escucha
        hiddenInput.dispatchEvent(new Event('change'));
        
        // Cerrar menú
        customSelect.classList.remove('open');
    });
});

// Cerrar el menú si haces clic fuera
document.addEventListener('click', (e) => {
    if (!customSelect.contains(e.target)) {
        customSelect.classList.remove('open');
    }
});

// Botón Limpiar
document.getElementById('btnLimpiar').addEventListener('click', () => {
    // Limpiar buscador
    document.getElementById('buscarEstacionamiento').value = '';
    document.getElementById('buscarEstacionamiento').dispatchEvent(new Event('input'));
    
    // Restablecer dropdown
    selectLabel.textContent = 'Todos los estados';
    hiddenInput.value = '';
    hiddenInput.dispatchEvent(new Event('change'));
    
    options.forEach(opt => opt.classList.remove('selected'));
    document.querySelector('.option[data-value=""]').classList.add('selected');
});
</script>



</body>

</html>
